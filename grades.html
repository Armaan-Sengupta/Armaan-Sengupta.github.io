<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Grades · Armaan Sengupta</title>
<meta name="description" content="University of Waterloo Mechatronics Engineering grades for Armaan Sengupta.">
<link rel="canonical" href="https://www.armaansengupta.ca/grades">
<meta name="author" content="Armaan Sengupta">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="/grades.css">
<script type="module" src="/grades.js"></script>
</head>
<body>

<header class="top">
  <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>Armaan Sengupta</a>
  <nav aria-label="Page navigation">
    <a href="/">← Portfolio</a>
  </nav>
</header>

<main class="page wrap">
  <header class="page-head">
    <div>
      <p class="eyebrow mono">Mechatronics Engineering · University of Waterloo</p>
      <div class="title-row">
        <h1>Grades</h1>
        <span class="avg-pill mono" id="summary"></span>
      </div>
    </div>

    <div class="controls">
      <div class="legend" id="legend" aria-label="Grade legend">
        <span class="legend-item"><i class="swatch tier-peak"></i>95+</span>
        <span class="legend-item"><i class="swatch tier-high"></i>90–94</span>
        <span class="legend-item"><i class="swatch tier-mid"></i>85–89</span>
        <span class="legend-item"><i class="swatch tier-base"></i>80–84</span>
      </div>

      <div class="seg" role="tablist" aria-label="View">
        <button type="button" class="seg-btn is-on" role="tab" aria-selected="true" data-view="tree">Graph</button>
        <button type="button" class="seg-btn" role="tab" aria-selected="false" data-view="table">Table</button>
      </div>
    </div>
  </header>

  <section class="tree-section" id="tree-view" aria-label="Course graph">
    <div class="tree-frame">
      <div class="tree-scroll">
        <div class="tree-canvas" id="tree-canvas">
          <svg class="tree-edges" id="tree-edges" aria-hidden="true"></svg>
          <div class="tree-grid" id="tree-grid"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="table-section" id="table-view" hidden aria-label="Grades by term">
    <div class="table-wrap" id="table-wrap"></div>
  </section>
</main>

<aside class="side-panel" id="course-panel" aria-label="Course details" aria-hidden="true">
  <div class="sp-head">
    <div class="sp-head-top">
      <div class="sp-badges">
        <span class="sp-code mono" id="sp-code"></span>
        <span class="sp-grade mono" id="sp-grade"></span>
      </div>
      <button type="button" class="sp-close" id="sp-close" aria-label="Close course details">✕</button>
    </div>
    <h2 class="sp-title" id="sp-title"></h2>
    <div class="sp-meta-row">
      <span class="sp-meta mono" id="sp-meta"></span>
      <a class="sp-flow mono" id="sp-flow" href="https://uwflow.com" target="_blank" rel="noopener">UW Flow ↗</a>
    </div>
  </div>

  <div class="sp-body">
    <div class="sp-section">
      <h3 class="sp-label mono">Description</h3>
      <p class="sp-desc" id="sp-desc"></p>
    </div>

    <div class="sp-section">
      <h3 class="sp-label mono"><span class="sp-dot is-prereq"></span>Fed by</h3>
      <div class="sp-links" id="sp-prereqs"></div>
    </div>

    <div class="sp-section">
      <h3 class="sp-label mono"><span class="sp-dot is-unlock"></span>Feeds into</h3>
      <div class="sp-links" id="sp-unlocks"></div>
    </div>
  </div>
</aside>

<footer class="foot wrap">
  <a href="/">armaansengupta.ca</a>
  <span class="mono">© 2026 Armaan Sengupta</span>
</footer>

</body>
</html>
